services:
  # --- OIDC Provider ---
  api:
    build: ./provider
    ports: ["3000:3000"]
    environment:
      PORT: "3000"
      BETTER_AUTH_URL: "http://localhost:3000"
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      FRONTEND_URL: "http://localhost:5173"
    depends_on:
      db:
        condition: service_healthy

  # --- Provider Frontend ---
  provider-web:
    build: ./provider/web
    ports: ["5173:5173"]

  # --- Client Backend ---
  client-server:
    build: ./client/server
    ports: ["8080:8080"]
    environment:
      PORT: "8080"
      PROVIDER_URL: "http://api:3000/api/auth"
      PROVIDER_PUBLIC_URL: "http://localhost:3000/api/auth"
      CLIENT_ID: ${CLIENT_ID}
      CLIENT_SECRET: ${CLIENT_SECRET}
      REDIRECT_URI: "http://localhost:8080/callback"
      FRONTEND_URL: "http://localhost:5174"

  # --- Client Frontend ---
  client-web:
    build: ./client/web
    ports: ["5174:5174"]

  # --- Database ---
  db:
    image: postgres:17
    ports: ["5433:5432"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
